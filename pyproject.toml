[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sans-analysis-workshop"
version = "0.2.0"
description = "Masters workshop on SANS model fitting with sans-fitter"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "SANS Data Analysis Workshop contributors"}]
readme = "README.md"
dependencies = [
    "sans-fitter>=0.4,<0.5",
    "numpy>=2.0",
    "matplotlib>=3.5",
    "jupyterlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "nbconvert>=7.0",
    "ipykernel>=6.0",
    "ruff>=0.8.0",
]

[tool.setuptools]
# The workshop is notebooks, data and scripts: there is no Python package to install.
packages = []
py-modules = []

[tool.pixi.workspace]
name = "sans-analysis-workshop"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
sans-fitter = ">=0.4, <0.5"

[tool.pixi.dependencies]
python = ">=3.10,<3.14"
numpy = ">=2.0"
matplotlib = ">=3.5"
scipy = ">=1.7"
sasmodels = ">=1.0"
bumps = ">=1.0"
plotly = ">=5.0"
jupyterlab = ">=4.0"
nbconvert = ">=7.0"
ipykernel = ">=6.0"
ruff = ">=0.8.0"

[tool.pixi.tasks]
workshop = "jupyter lab exercises"
generate-workshop-data = "python scripts/generate_workshop.py --data-only"
generate-mystery-data = "python scripts/generate_mystery_data.py"
check-workshop = "python scripts/generate_workshop.py --check"
lint = "ruff check scripts/ --fix"
lint-check = "ruff check scripts/"
format = "ruff format scripts/"
format-check = "ruff format --check scripts/"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "Q",   # flake8-quotes
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "Q001",  # single quotes for multiline strings (conflicts with formatter)
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
