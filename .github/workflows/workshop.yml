name: Workshop checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install workshop
        run: python -m pip install -e ".[dev]"

      - name: Check code quality
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Run fitting tests
        run: pytest

      - name: Execute workshop notebooks
        env:
          MPLBACKEND: Agg
        run: python scripts/generate_workshop.py --check
